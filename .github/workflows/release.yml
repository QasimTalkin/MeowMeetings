name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run package

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MeowMeetings-*-universal.dmg
          generate_release_notes: true
